name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"  # 触发条件：推送版本 tag（如 v1.0.0）

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_dir: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
            artifact_glob: "*.exe"
            artifact_label: "Windows installer"

          - os: macos-latest
            target: universal-apple-darwin
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
            artifact_glob: "*.dmg"
            artifact_label: "macOS disk image"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build -- --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Find build artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="${{ matrix.bundle_dir }}"
          GLOB="${{ matrix.artifact_glob }}"

          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Bundle dir not found: $BUNDLE_DIR"
            exit 1
          fi

          # 找所有匹配文件（多个用换行分隔）
          FILES=$(find "$BUNDLE_DIR" -name "$GLOB" | tr '\n' '\n')
          if [ -z "$FILES" ]; then
            echo "No $GLOB artifacts in $BUNDLE_DIR"
            exit 1
          fi

          echo "Found artifacts:"
          echo "$FILES"

          # 取第一个（NSIS installer 优先于 msi）
          FIRST=$(find "$BUNDLE_DIR" -name "$GLOB" | head -1)
          echo "artifact_path=$FIRST" >> $GITHUB_OUTPUT
          echo "artifact_name=$(basename $FIRST)" >> $GITHUB_OUTPUT

      - name: Upload artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_label }}
          path: ${{ steps.artifacts.outputs.artifact_path }}
          retention-days: 30

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifacts.outputs.artifact_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
