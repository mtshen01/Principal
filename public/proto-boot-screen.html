<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开屏页 · Principal 原型</title>
<link rel="stylesheet" href="/css/boot-screen.css">
<style>
  /* 取自 app.css 的设计变量 */
  :root {
    --bg: #0e0f13;
    --text: #e9e7e3;
    --muted: #8b8b9a;
    --faint: #5a5b68;
    --accent: #d97757;
    --mono: 'Cascadia Code', 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; }

  /* 全屏开屏罩：与 index.html 的 #bootOverlay 同构 */
  .screen { position: fixed; inset: 0; }

  /* 调试面板：仅原型用，真正接入时不存在 */
  .panel {
    position: fixed; right: 16px; bottom: 16px; z-index: 10;
    background: rgba(22,23,31,.92); border: 1px solid #2a2b37; border-radius: 10px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
    font-size: 12px; color: var(--muted); backdrop-filter: blur(6px);
  }
  .panel .grp { font-size: 10.5px; letter-spacing: .12em; color: var(--faint); }
  .panel .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .panel input[type=range] { accent-color: var(--accent); width: 110px; }
  .panel .val { min-width: 74px; text-align: right; color: var(--text); }
</style>
</head>
<body>

<div class="screen">
  <div class="boot-bg" id="bg">
    <div class="boot-bg-mask" id="mask"></div>
  </div>

  <div class="boot-splash">PRINCIPAL</div>
</div>

<div class="panel">
  <span class="grp">图案（对齐官方参数）</span>
  <div class="row">速度 <input type="range" id="speed" min="2" max="30" step="0.5" value="8"><span class="val" id="speedVal">8s · 30px/s</span></div>
  <div class="row">间距 <input type="range" id="gap" min="8" max="40" step="4" value="24"><span class="val" id="gapVal">24px</span></div>
  <div class="row">方块浓度 <input type="range" id="alpha" min="5" max="100" value="40"><span class="val" id="alphaVal">0.40</span></div>
  <div class="row">遮罩中心 <input type="range" id="hole" min="0" max="60" value="20"><span class="val" id="holeVal">20%</span></div>
</div>

<script>
  const bg = document.getElementById('bg');
  const mask = document.getElementById('mask');
  const val = (id, v) => { document.getElementById(id).textContent = v; };

  // 方块浓度改的是 SVG 的 fill-opacity，而不是整层 opacity ——
  // 后者会把底色一起变淡，图案与背景的关系就不对了
  function paint(gap, alpha) {
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${gap}' height='${gap}'>`
      + `<rect width='3' height='3' fill='#d97757' fill-opacity='${alpha}'/></svg>`;
    bg.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    bg.style.backgroundSize = `${gap}px ${gap}px`;
  }

  const speed = document.getElementById('speed');
  const gap = document.getElementById('gap');
  const alpha = document.getElementById('alpha');
  const hole = document.getElementById('hole');

  speed.addEventListener('input', () => {
    bg.style.animationDuration = speed.value + 's';
    // 同时报出等效速度：位移固定 240px，px/s 才是能和官方档位对比的量
    val('speedVal', `${speed.value}s · ${(240 / speed.value).toFixed(0)}px/s`);
  });
  const repaint = () => {
    paint(Number(gap.value), (alpha.value / 100).toFixed(2));
    val('gapVal', gap.value + 'px');
    val('alphaVal', (alpha.value / 100).toFixed(2));
  };
  gap.addEventListener('input', repaint);
  alpha.addEventListener('input', repaint);

  hole.addEventListener('input', () => {
    const m = `radial-gradient(ellipse at center, transparent ${hole.value}%, #000 100%)`;
    mask.style.webkitMaskImage = m;
    mask.style.maskImage = m;
    val('holeVal', hole.value + '%');
  });
</script>
</body>
</html>
